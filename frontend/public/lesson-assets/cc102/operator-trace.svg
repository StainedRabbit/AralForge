<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Java operator tracing guide</title>
  <desc id="desc">A trace table showing how arithmetic and comparison expressions are evaluated.</desc>
  <rect width="1200" height="680" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Trace Java Operators Before Running</text>
  <rect x="80" y="125" width="1040" height="430" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <g font-family="Arial, sans-serif" font-size="24">
    <rect x="80" y="125" width="1040" height="70" fill="#ffedd5"/>
    <text x="130" y="170" fill="#0f172a" font-weight="700">Expression</text>
    <text x="470" y="170" fill="#0f172a" font-weight="700">Substitute Values</text>
    <text x="820" y="170" fill="#0f172a" font-weight="700">Result</text>
    <text x="130" y="250" fill="#0f172a" font-family="Consolas, monospace">sum = a + b</text>
    <text x="470" y="250" fill="#0f172a" font-family="Consolas, monospace">sum = 5 + 7</text>
    <text x="820" y="250" fill="#166534" font-family="Consolas, monospace" font-weight="700">12</text>
    <text x="130" y="330" fill="#0f172a" font-family="Consolas, monospace">average = (90 + 84 + 96) / 3.0</text>
    <text x="470" y="330" fill="#0f172a" font-family="Consolas, monospace">270 / 3.0</text>
    <text x="820" y="330" fill="#166534" font-family="Consolas, monospace" font-weight="700">90.0</text>
    <text x="130" y="410" fill="#0f172a" font-family="Consolas, monospace">grade &gt;= 75</text>
    <text x="470" y="410" fill="#0f172a" font-family="Consolas, monospace">90 &gt;= 75</text>
    <text x="820" y="410" fill="#166534" font-family="Consolas, monospace" font-weight="700">true</text>
    <text x="130" y="490" fill="#0f172a" font-family="Consolas, monospace">passed &amp;&amp; present</text>
    <text x="470" y="490" fill="#0f172a" font-family="Consolas, monospace">true &amp;&amp; false</text>
    <text x="820" y="490" fill="#991b1b" font-family="Consolas, monospace" font-weight="700">false</text>
  </g>
  <line x1="80" y1="195" x2="1120" y2="195" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="420" y1="125" x2="420" y2="555" stroke="#cbd5e1" stroke-width="3"/>
  <line x1="770" y1="125" x2="770" y2="555" stroke="#cbd5e1" stroke-width="3"/>
  <text x="600" y="625" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Trace first, then run. If the trace and output disagree, investigate.</text>
</svg>
