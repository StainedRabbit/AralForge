<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Pseudocode pattern guide</title>
  <desc id="desc">Pseudocode keywords and pattern for input process output and decisions.</desc>
  <rect width="1200" height="690" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Pseudocode Patterns</text>
  <rect x="80" y="125" width="510" height="470" rx="8" fill="#111827"/>
  <text x="120" y="175" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">START</text>
  <text x="120" y="220" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">INPUT number1</text>
  <text x="120" y="265" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">INPUT number2</text>
  <text x="120" y="310" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">SET sum = number1 + number2</text>
  <text x="120" y="355" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">IF sum &gt;= 10 THEN</text>
  <text x="160" y="400" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">DISPLAY "Large sum"</text>
  <text x="120" y="445" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">ELSE</text>
  <text x="160" y="490" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">DISPLAY "Small sum"</text>
  <text x="120" y="535" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">END IF</text>
  <text x="120" y="580" fill="#f8fafc" font-family="Consolas, monospace" font-size="26">END</text>
  <g font-family="Arial, sans-serif">
    <rect x="670" y="145" width="370" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="700" y="183" fill="#0f172a" font-size="24" font-weight="700">INPUT means receive data</text>
    <rect x="670" y="230" width="370" height="58" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <text x="700" y="268" fill="#0f172a" font-size="24" font-weight="700">SET means compute or store</text>
    <rect x="670" y="315" width="370" height="58" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="700" y="353" fill="#0f172a" font-size="24" font-weight="700">DISPLAY means show output</text>
    <rect x="670" y="400" width="370" height="58" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="700" y="438" fill="#0f172a" font-size="24" font-weight="700">IF/ELSE means decide</text>
  </g>
</svg>
