<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Java program structure guide</title>
  <desc id="desc">A labeled guide showing class, main method, statements, comments, variables, and braces in a beginner Java program.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="70" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Java Program Structure</text>
  <rect x="60" y="110" width="700" height="520" rx="8" fill="#111827"/>
  <text x="90" y="160" fill="#93c5fd" font-family="Consolas, monospace" font-size="24">public class StudentInfo {</text>
  <text x="130" y="210" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">public static void main(String[] args) {</text>
  <text x="170" y="260" fill="#86efac" font-family="Consolas, monospace" font-size="24">// store student details</text>
  <text x="170" y="310" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">String name = "Ana";</text>
  <text x="170" y="360" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">int age = 18;</text>
  <text x="170" y="410" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">System.out.println(name);</text>
  <text x="130" y="460" fill="#f8fafc" font-family="Consolas, monospace" font-size="24">}</text>
  <text x="90" y="510" fill="#93c5fd" font-family="Consolas, monospace" font-size="24">}</text>
  <g fill="#ffffff" stroke="#c2410c" stroke-width="3">
    <rect x="820" y="125" width="280" height="58" rx="8"/>
    <rect x="820" y="205" width="280" height="58" rx="8"/>
    <rect x="820" y="285" width="280" height="58" rx="8"/>
    <rect x="820" y="365" width="280" height="58" rx="8"/>
    <rect x="820" y="445" width="280" height="58" rx="8"/>
  </g>
  <g fill="#0f172a" font-family="Arial, sans-serif" font-size="22" font-weight="700">
    <text x="845" y="162">Class name</text>
    <text x="845" y="242">Main method</text>
    <text x="845" y="322">Comment</text>
    <text x="845" y="402">Variables</text>
    <text x="845" y="482">Output statement</text>
  </g>
  <g stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M810 154 H700"/>
    <path d="M810 234 H670"/>
    <path d="M810 314 H520"/>
    <path d="M810 394 H500"/>
    <path d="M810 474 H580"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
