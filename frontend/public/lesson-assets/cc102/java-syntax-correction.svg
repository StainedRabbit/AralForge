<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Java syntax correction guide</title>
  <desc id="desc">A guide showing common Java syntax errors and corrected versions.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Java Syntax: Spot It, Fix It</text>
  <g font-family="Arial, sans-serif">
    <rect x="70" y="125" width="500" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="100" y="167" fill="#991b1b" font-size="24" font-weight="700">Missing semicolon</text>
    <text x="100" y="205" fill="#0f172a" font-family="Consolas, monospace" font-size="23">System.out.println("Hi")</text>
    <rect x="630" y="125" width="500" height="105" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="660" y="167" fill="#166534" font-size="24" font-weight="700">Correct</text>
    <text x="660" y="205" fill="#0f172a" font-family="Consolas, monospace" font-size="23">System.out.println("Hi");</text>
    <rect x="70" y="275" width="500" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="100" y="317" fill="#991b1b" font-size="24" font-weight="700">Wrong capitalization</text>
    <text x="100" y="355" fill="#0f172a" font-family="Consolas, monospace" font-size="23">system.out.println("Hi");</text>
    <rect x="630" y="275" width="500" height="105" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="660" y="317" fill="#166534" font-size="24" font-weight="700">Correct</text>
    <text x="660" y="355" fill="#0f172a" font-family="Consolas, monospace" font-size="23">System.out.println("Hi");</text>
    <rect x="70" y="425" width="500" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="100" y="467" fill="#991b1b" font-size="24" font-weight="700">Missing quotation mark</text>
    <text x="100" y="505" fill="#0f172a" font-family="Consolas, monospace" font-size="23">System.out.println("Hi);</text>
    <rect x="630" y="425" width="500" height="105" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text x="660" y="467" fill="#166534" font-size="24" font-weight="700">Correct</text>
    <text x="660" y="505" fill="#0f172a" font-family="Consolas, monospace" font-size="23">System.out.println("Hi");</text>
  </g>
  <text x="600" y="625" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" font-weight="700" text-anchor="middle">Checklist: capitalization, quotes, semicolon, braces.</text>
</svg>
