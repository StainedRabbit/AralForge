<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Java operators reference</title>
  <desc id="desc">Reference chart for arithmetic, assignment, comparison, and logical operators in Java.</desc>
  <rect width="1200" height="720" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Java Operators Reference</text>
  <g font-family="Arial, sans-serif" fill="#0f172a">
    <rect x="70" y="125" width="500" height="115" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="100" y="170" font-size="28" font-weight="700">Arithmetic</text>
    <text x="100" y="210" font-size="24">+  -  *  /  %</text>
    <rect x="630" y="125" width="500" height="115" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
    <text x="660" y="170" font-size="28" font-weight="700">Assignment</text>
    <text x="660" y="210" font-size="24">=  +=  -=  *=  /=</text>
    <rect x="70" y="285" width="500" height="115" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="100" y="330" font-size="28" font-weight="700">Comparison</text>
    <text x="100" y="370" font-size="24">==  !=  &gt;  &lt;  &gt;=  &lt;=</text>
    <rect x="630" y="285" width="500" height="115" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="660" y="330" font-size="28" font-weight="700">Logical</text>
    <text x="660" y="370" font-size="24">&amp;&amp; means AND     || means OR     ! means NOT</text>
    <rect x="190" y="485" width="820" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
    <text x="600" y="530" font-size="26" font-weight="700" text-anchor="middle">Trace expressions before running code.</text>
    <text x="600" y="565" font-size="22" text-anchor="middle">Example: average = (grade1 + grade2 + grade3) / 3.0</text>
  </g>
</svg>
