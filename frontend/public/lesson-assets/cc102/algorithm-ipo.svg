<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Algorithm and IPO guide</title>
  <desc id="desc">Input, process, and output guide for planning algorithms.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Algorithm Planning: IPO</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="90" y="190" width="260" height="150" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="220" y="245" fill="#0f172a" font-size="34" font-weight="700">Input</text>
    <text x="220" y="285" fill="#475569" font-size="21">What do we need?</text>
    <rect x="470" y="190" width="260" height="150" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
    <text x="600" y="245" fill="#0f172a" font-size="34" font-weight="700">Process</text>
    <text x="600" y="285" fill="#475569" font-size="21">What steps happen?</text>
    <rect x="850" y="190" width="260" height="150" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="980" y="245" fill="#0f172a" font-size="34" font-weight="700">Output</text>
    <text x="980" y="285" fill="#475569" font-size="21">What result appears?</text>
  </g>
  <g stroke="#c2410c" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M350 265 H465"/>
    <path d="M730 265 H845"/>
  </g>
  <rect x="180" y="430" width="840" height="78" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  <text x="600" y="480" fill="#0f172a" font-family="Arial, sans-serif" font-size="26" text-anchor="middle">Example: numbers 5 and 7 -> add them -> display 12</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
