<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Java file input and output flow guide</title>
  <desc id="desc">Flow showing writing data to a text file and reading data from a text file.</desc>
  <rect width="1200" height="650" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Java File I/O Flow</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="95" y="160" width="230" height="105" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="210" y="205" fill="#0f172a" font-size="25" font-weight="700">Program Data</text>
    <text x="210" y="238" fill="#475569" font-size="18">name, grade, course</text>
    <rect x="485" y="160" width="230" height="105" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
    <text x="600" y="205" fill="#0f172a" font-size="25" font-weight="700">FileWriter</text>
    <text x="600" y="238" fill="#475569" font-size="18">writes text</text>
    <rect x="875" y="160" width="230" height="105" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="990" y="205" fill="#0f172a" font-size="25" font-weight="700">student.txt</text>
    <text x="990" y="238" fill="#475569" font-size="18">saved file</text>
    <rect x="875" y="390" width="230" height="105" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="990" y="435" fill="#0f172a" font-size="25" font-weight="700">student.txt</text>
    <text x="990" y="468" fill="#475569" font-size="18">existing file</text>
    <rect x="485" y="390" width="230" height="105" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="600" y="435" fill="#0f172a" font-size="25" font-weight="700">Scanner</text>
    <text x="600" y="468" fill="#475569" font-size="18">reads lines</text>
    <rect x="95" y="390" width="230" height="105" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="210" y="435" fill="#0f172a" font-size="25" font-weight="700">Console</text>
    <text x="210" y="468" fill="#475569" font-size="18">displays content</text>
  </g>
  <g stroke="#c2410c" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M325 212 H480"/>
    <path d="M715 212 H870"/>
    <path d="M875 442 H720"/>
    <path d="M485 442 H330"/>
  </g>
  <text x="600" y="322" fill="#0f172a" font-family="Arial, sans-serif" font-size="25" font-weight="700" text-anchor="middle">Write flow goes left to right. Read flow goes right to left.</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
