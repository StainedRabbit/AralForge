<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Java toolchain guide</title>
  <desc id="desc">A flow showing source code, compiler, bytecode, JVM, and program output.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">How Java Tools Work Together</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="70" y="180" width="180" height="120" rx="8" fill="#ffedd5" stroke="#c2410c" stroke-width="3"/>
    <text x="160" y="232" fill="#0f172a" font-size="25" font-weight="700">Source Code</text>
    <text x="160" y="266" fill="#475569" font-size="18">.java file</text>
    <rect x="320" y="180" width="180" height="120" rx="8" fill="#fef3c7" stroke="#92400e" stroke-width="3"/>
    <text x="410" y="232" fill="#0f172a" font-size="25" font-weight="700">Compiler</text>
    <text x="410" y="266" fill="#475569" font-size="18">javac</text>
    <rect x="570" y="180" width="180" height="120" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="660" y="232" fill="#0f172a" font-size="25" font-weight="700">Bytecode</text>
    <text x="660" y="266" fill="#475569" font-size="18">.class file</text>
    <rect x="820" y="180" width="180" height="120" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="910" y="232" fill="#0f172a" font-size="25" font-weight="700">JVM</text>
    <text x="910" y="266" fill="#475569" font-size="18">runs bytecode</text>
    <rect x="450" y="410" width="300" height="100" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="600" y="454" fill="#0f172a" font-size="25" font-weight="700">Output</text>
    <text x="600" y="488" fill="#475569" font-size="18">console result</text>
  </g>
  <g stroke="#c2410c" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M250 240 H315"/>
    <path d="M500 240 H565"/>
    <path d="M750 240 H815"/>
    <path d="M910 305 C910 390 755 425 755 455"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#c2410c"/>
    </marker>
  </defs>
</svg>
