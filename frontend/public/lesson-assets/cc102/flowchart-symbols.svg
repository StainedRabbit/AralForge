<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="520" viewBox="0 0 1800 520" role="img" aria-labelledby="title desc">
  <title id="title">Flowchart symbol guide</title>
  <desc id="desc">A single-row classroom guide to the basic flowchart symbols.</desc>

  <defs>
    <marker id="arrow-blue" markerWidth="14" markerHeight="14" refX="12" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,10 L13,5 z" fill="#c2410c"/>
    </marker>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1800" height="520" fill="#f8fafc"/>

  <rect x="34" y="34" width="1732" height="452" rx="34" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>

  <g font-family="Arial, sans-serif">
    <text x="70" y="95" fill="#0f172a" font-size="40" font-weight="700">Flowchart Symbols We Use</text>
    <text x="70" y="135" fill="#475569" font-size="22">Choose the shape by asking what the step does in the program logic.</text>

    <!-- Terminal -->
    <g transform="translate(70 185)" filter="url(#soft-shadow)">
      <rect width="310" height="240" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="3"/>
      <rect x="50" y="36" width="210" height="70" rx="35" fill="#ffedd5" stroke="#c2410c" stroke-width="5"/>
      <text x="155" y="80" fill="#0f172a" font-size="23" font-weight="700" text-anchor="middle">Start / End</text>

      <text x="155" y="145" fill="#0f172a" font-size="26" font-weight="700" text-anchor="middle">Terminal</text>
      <text x="155" y="180" fill="#475569" font-size="19" text-anchor="middle">Begins or stops</text>
      <text x="155" y="207" fill="#475569" font-size="19" text-anchor="middle">the flowchart.</text>
    </g>

    <!-- Process -->
    <g transform="translate(410 185)" filter="url(#soft-shadow)">
      <rect width="310" height="240" rx="24" fill="#f0fdfa" stroke="#99f6e4" stroke-width="3"/>
      <rect x="50" y="36" width="210" height="70" rx="10" fill="#fef3c7" stroke="#92400e" stroke-width="5"/>
      <text x="155" y="80" fill="#0f172a" font-size="23" font-weight="700" text-anchor="middle">Process</text>

      <text x="155" y="145" fill="#0f172a" font-size="26" font-weight="700" text-anchor="middle">Action</text>
      <text x="155" y="180" fill="#475569" font-size="19" text-anchor="middle">Use for assignment</text>
      <text x="155" y="207" fill="#475569" font-size="19" text-anchor="middle">or calculation.</text>
    </g>

    <!-- Input / Output -->
    <g transform="translate(750 185)" filter="url(#soft-shadow)">
      <rect width="310" height="240" rx="24" fill="#fffbeb" stroke="#fde68a" stroke-width="3"/>
      <polygon points="70,36 260,36 220,106 30,106" fill="#fef3c7" stroke="#d97706" stroke-width="5"/>
      <text x="145" y="80" fill="#0f172a" font-size="22" font-weight="700" text-anchor="middle">Input / Output</text>

      <text x="155" y="145" fill="#0f172a" font-size="26" font-weight="700" text-anchor="middle">Data</text>
      <text x="155" y="180" fill="#475569" font-size="19" text-anchor="middle">Receives input or</text>
      <text x="155" y="207" fill="#475569" font-size="19" text-anchor="middle">displays output.</text>
    </g>

    <!-- Decision -->
    <g transform="translate(1090 185)" filter="url(#soft-shadow)">
      <rect width="310" height="240" rx="24" fill="#fff1f2" stroke="#fecdd3" stroke-width="3"/>
      <polygon points="155,24 260,76 155,128 50,76" fill="#fee2e2" stroke="#dc2626" stroke-width="5"/>
      <text x="155" y="85" fill="#0f172a" font-size="23" font-weight="700" text-anchor="middle">Decision</text>

      <text x="155" y="145" fill="#0f172a" font-size="26" font-weight="700" text-anchor="middle">Question</text>
      <text x="155" y="180" fill="#475569" font-size="19" text-anchor="middle">Use for Yes/No</text>
      <text x="155" y="207" fill="#475569" font-size="19" text-anchor="middle">or True/False.</text>
    </g>

    <!-- Flowline -->
    <g transform="translate(1430 185)" filter="url(#soft-shadow)">
      <rect width="300" height="240" rx="24" fill="#eef2ff" stroke="#c7d2fe" stroke-width="3"/>
      <path d="M45 72 H210" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
      <circle cx="245" cy="72" r="27" fill="#e0f2fe" stroke="#0284c7" stroke-width="5"/>
      <text x="245" y="82" fill="#0f172a" font-size="25" font-weight="700" text-anchor="middle">A</text>

      <text x="150" y="145" fill="#0f172a" font-size="26" font-weight="700" text-anchor="middle">Flowline</text>
      <text x="150" y="180" fill="#475569" font-size="19" text-anchor="middle">Shows the direction</text>
      <text x="150" y="207" fill="#475569" font-size="19" text-anchor="middle">to trace.</text>
    </g>
  </g>
</svg>