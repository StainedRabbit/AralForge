<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Scanner input flow guide</title>
  <desc id="desc">Flow showing prompt, user input, Scanner reads value, variable stores value, and program uses value.</desc>
  <rect width="1200" height="620" fill="#f8fafc"/>
  <text x="60" y="72" fill="#0f172a" font-family="Arial, sans-serif" font-size="38" font-weight="700">Scanner Input Flow</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="80" y="200" width="180" height="110" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text x="170" y="247" fill="#0f172a" font-size="25" font-weight="700">Prompt</text>
    <text x="170" y="281" fill="#475569" font-size="18">ask clearly</text>
    <rect x="320" y="200" width="180" height="110" rx="8" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/>
    <text x="410" y="247" fill="#0f172a" font-size="25" font-weight="700">User Types</text>
    <text x="410" y="281" fill="#475569" font-size="18">keyboard input</text>
    <rect x="560" y="200" width="180" height="110" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text x="650" y="247" fill="#0f172a" font-size="25" font-weight="700">Scanner</text>
    <text x="650" y="281" fill="#475569" font-size="18">reads value</text>
    <rect x="800" y="200" width="180" height="110" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
    <text x="890" y="247" fill="#0f172a" font-size="25" font-weight="700">Variable</text>
    <text x="890" y="281" fill="#475569" font-size="18">stores value</text>
    <rect x="500" y="420" width="200" height="90" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/>
    <text x="600" y="474" fill="#0f172a" font-size="25" font-weight="700">Use Value</text>
  </g>
  <g stroke="#2563eb" stroke-width="5" fill="none" marker-end="url(#arrow)">
    <path d="M260 255 H315"/>
    <path d="M500 255 H555"/>
    <path d="M740 255 H795"/>
    <path d="M890 315 C890 405 705 440 705 465"/>
  </g>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L11,4 z" fill="#2563eb"/>
    </marker>
  </defs>
</svg>
