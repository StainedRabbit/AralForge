name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - production

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ezoryx_ci
          POSTGRES_USER: ezoryx
          POSTGRES_PASSWORD: ezoryx-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ezoryx -d ezoryx_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://ezoryx:ezoryx-ci-password@127.0.0.1:5432/ezoryx_ci
      SECRET_KEY: 'zB7!qT2@L9#nR4$vX8%kM3^pH6&cJ1*wF5-yU0_gS9+aD2=eN7!rK4@xP8#tV3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: pip
      - run: pip install -r ../requirements.txt
      - name: Production configuration check
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: api.example.test
          CORS_ALLOWED_ORIGINS: https://frontend.example.test
          CSRF_TRUSTED_ORIGINS: https://frontend.example.test
          SUPABASE_S3_ENDPOINT: https://storage.example.test/storage/v1/s3
          SUPABASE_S3_REGION: ap-southeast-1
          SUPABASE_S3_ACCESS_KEY_ID: ci-placeholder
          SUPABASE_S3_SECRET_ACCESS_KEY: ci-placeholder-secret
          SUPABASE_STORAGE_BUCKET: ci-placeholder
        run: python manage.py check --deploy --fail-level WARNING
      - name: Migration consistency
        env:
          DEBUG: "True"
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate empty PostgreSQL database
        env:
          DEBUG: "True"
        run: python manage.py migrate --noinput
      - name: Backend tests on PostgreSQL
        env:
          DEBUG: "True"
        run: python manage.py test --noinput

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.3"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r ../requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag ezoryx-ci .
      - name: Start image
        run: docker run --detach --name ezoryx-ci --publish 8000:10000 --env DEBUG=True ezoryx-ci
      - name: Verify container health
        run: curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8000/api/health/
      - name: Print logs on failure
        if: failure()
        run: docker logs ezoryx-ci
